<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>

        .container{
            display: flex;
            background-color: rgb(14,12,94);
            flex-direction: row;
        }

        .container .div1{
            flex: 1;
            background-color: rgb(208, 255, 0);
        }

        .container .div2{
            flex: 1;
            background-color: rgb(111, 0, 255);
        }

        .container .div3{
            flex: 1;
            background-color: rgb(51, 255, 0);
        }

        .container .div4{
            flex: 1;
            background-color: rgb(162, 68, 33);
        }

        .container div{
            margin: 12px;
            padding: 100px;
            font-size: 18px;
            border-radius: 15px;
            color: aliceblue;
            text-align: center;
        }

    </style>
</head>

<body>

    <!-- Container pai -->
    <div class="container">
        <div class="div1">1</div>
        <div class="div2">2</div>
        <div class="div3">3</div>
        <div class="div4">4</div>
    </div>

</body>
</html>
